<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2350">
  <title>Korean Basketball League</title>
  <meta name="description" content="KBL 현역 선수 카드를 뽑아 팀을 꾸리고 시즌을 치르는 농구 카드 게임">
  <style>
:root {
  --navy: #1b2350;
  --navy-2: #222b5e;
  --navy-3: #2c3770;
  --deep: #141a3f;
  --sky: #4a9fd8;
  --sky-2: #7cc0ea;
  --white: #ffffff;
  --text: #eef3ff;
  --muted: #9fb0d8;
  --ball: #f08a3c;
  --epic: #8fa2f0;
  --legend: #f6b37a;
  --radius: 14px;
  --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--deep);
  color: var(--text);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--navy); position: relative; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
.eyebrow { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--sky-2); }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 12px; background: var(--navy-3); color: var(--text); font-weight: 700; font-size: 14px; flex: 1; transition: transform .1s; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--sky); color: var(--white); box-shadow: 0 4px 0 #2d76ad; }
.btn.big { padding: 14px 18px; font-size: 16px; width: 100%; }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--navy-3); width: 100%; margin-top: 8px; }
.row { display: flex; gap: 8px; margin-top: 12px; }

/* 상단바 / 하단 내비 */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(27, 35, 80, 0.94); backdrop-filter: blur(6px); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; }
.ball-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 3px rgba(240, 138, 60, 0.25); }
.coins { display: flex; align-items: center; gap: 6px; font-weight: 800; background: var(--deep); padding: 5px 12px 5px 6px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.coin, i.coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd27a, #f08a3c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35); vertical-align: -3px; }
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex; background: var(--deep); border-top: 1px solid var(--navy-3); z-index: 30; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 600; }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn.on { color: var(--white); }
.nav-btn.on svg { color: var(--sky); }
.screen { padding: 4px 16px calc(var(--nav-h) + 28px); }

/* 패널 */
.panel { background: var(--navy-2); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
.panel h3 { font-size: 16px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 10px 0 0; text-align: center; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel .panel-head + .panel-head, .sheet .panel-head { margin-top: 14px; }
.tag { font-size: 11px; font-weight: 700; color: var(--sky-2); background: rgba(74, 159, 216, 0.14); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.tag.orange { color: var(--ball); background: rgba(240, 138, 60, 0.14); }
.panel.warn { border: 1px dashed var(--ball); }
.panel.warn p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.panel.tips p { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
.reset { margin-top: 18px; }

/* 인트로 */
.intro { min-height: 100vh; display: flex; flex-direction: column; }
.intro-art { height: 46vh; min-height: 260px; overflow: hidden; }
.intro-art svg { width: 100%; height: 100%; display: block; }
.intro-body { padding: 8px 20px 32px; }
.intro h1 { font-size: 32px; line-height: 1.15; margin: 4px 0 10px; }
.lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--navy-3); background: var(--deep); color: var(--text); font: inherit; font-size: 16px; outline: none; }
.field input:focus { border-color: var(--sky); }

/* 세그먼트 */
.seg { display: flex; background: var(--deep); border-radius: 12px; padding: 4px; gap: 2px; }
.seg-btn { flex: 1; padding: 9px 6px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg-btn.on { background: var(--sky); color: var(--white); }
.seg.mini { padding: 3px; border-radius: 10px; }
.seg.mini .seg-btn { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.seg.wide { margin: 8px 0 0; }
.filters { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

/* 홈 히어로 */
.hero-card { position: relative; border-radius: 18px; overflow: hidden; margin-top: 8px; background: var(--navy); }
.hero-art { height: 210px; }
.hero-art svg, .hero-svg { width: 100%; height: 100%; display: block; }
.hero-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: linear-gradient(to top, rgba(20, 26, 63, 0.95), rgba(20, 26, 63, 0)); }
.hero-info h2 { font-size: 22px; }
.hero-stats { display: flex; gap: 18px; margin-top: 6px; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font-size: 18px; font-variant-numeric: tabular-nums; }
.hero-stats span { font-size: 11px; color: var(--muted); }

/* 매치업 */
.matchup { display: flex; align-items: center; justify-content: space-around; gap: 8px; }
.tbadge { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 90px; }
.tbadge b { font-size: 15px; text-align: center; }
.tbadge small { color: var(--muted); font-size: 12px; }
.tlogo { width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #fff; background: var(--navy); box-shadow: inset 0 0 0 3px var(--tc), 0 6px 0 rgba(0, 0, 0, 0.18); }
.vs-mark { font-weight: 900; color: var(--ball); font-size: 18px; letter-spacing: 0.05em; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); font-size: 14px; }
.recent li:first-child { border-top: 0; }
.recent .wl { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: var(--navy-3); }
.recent li.w .wl { background: var(--sky); }
.recent .vs { flex: 1; color: var(--muted); }
.recent b { font-variant-numeric: tabular-nums; }
.panel.champ { text-align: center; background: linear-gradient(160deg, var(--navy-3), var(--navy-2)); border: 1px solid var(--ball); }
.panel.champ h2 { font-size: 26px; margin-bottom: 6px; }
.panel.champ p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

/* 카드 */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--navy); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25); cursor: pointer; text-align: left; }
.card-art { position: absolute; inset: 0; }
.card-art svg { width: 100%; height: 100%; display: block; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--rc, rgba(255, 255, 255, 0.35)); pointer-events: none; }
.card.r-C { --rc: rgba(255, 255, 255, 0.35); }
.card.r-R { --rc: var(--sky); }
.card.r-E { --rc: var(--epic); }
.card.r-L { --rc: var(--legend); box-shadow: 0 0 14px rgba(240, 138, 60, 0.45); }
.card.r-L::after { box-shadow: inset 0 0 0 3px var(--legend); }
.card-top { position: absolute; top: 6px; left: 8px; display: flex; flex-direction: column; line-height: 1; }
.card-top .ovr { font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); font-variant-numeric: tabular-nums; }
.card-top .pos { font-size: 11px; font-weight: 800; color: var(--sky-2); margin-top: 2px; }
.card-rar { position: absolute; top: 7px; right: 7px; font-size: 8px; font-weight: 800; letter-spacing: 0.08em; padding: 2px 5px; border-radius: 4px; background: var(--rc); color: var(--navy); }
.card.r-C .card-rar { background: rgba(255, 255, 255, 0.85); }
.card-lv { position: absolute; top: 24px; right: 7px; font-size: 10px; font-weight: 800; color: var(--ball); }
.card-new { position: absolute; top: 40px; right: 7px; font-size: 9px; font-weight: 900; color: #fff; background: var(--ball); padding: 1px 5px; border-radius: 4px; }
.card-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px; background: linear-gradient(to top, rgba(20, 26, 63, 0.92), rgba(20, 26, 63, 0)); }
.card-bottom .nm { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-bottom .tm { font-size: 10px; color: var(--muted); font-weight: 600; }
.card.locked { opacity: 0.6; box-shadow: none; }
.card.locked::after { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.card.locked .ovr { color: var(--muted); }

/* 가챠 */
.gacha-hero { display: flex; gap: 16px; align-items: center; margin-top: 10px; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, var(--navy-3), var(--navy-2)); position: relative; overflow: hidden; }
.gacha-hero::before { content: ""; position: absolute; width: 260px; height: 120px; right: -60px; bottom: -40px; background: var(--sky); opacity: 0.25; border-radius: 50%; transform: rotate(-18deg); }
.gacha-hero h2 { font-size: 20px; }
.gacha-hero .sub { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.pack-wrap { width: 84px; flex: none; animation: float 3s ease-in-out infinite; position: relative; }
.pack-wrap svg { width: 100%; display: block; filter: drop-shadow(-10px 12px 0 rgba(20, 26, 63, 0.5)); }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(-2deg); } }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pack-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 16px; border-radius: 14px; background: var(--navy-2); border: 1px solid var(--navy-3); text-align: left; }
.pack-btn b { font-size: 17px; }
.pack-btn small { font-size: 11px; color: var(--sky-2); font-weight: 600; }
.pack-btn span { margin-top: 10px; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.pack-btn.hot { background: var(--sky); border-color: var(--sky); box-shadow: 0 4px 0 #2d76ad; }
.pack-btn.hot small { color: #e8f6ff; }
.rates { list-style: none; margin: 0; padding: 0; }
.rates li { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
.rates li:first-child { border-top: 0; }
.rates li span:nth-child(2) { flex: 1; color: var(--muted); }
.chip { display: inline-block; min-width: 34px; text-align: center; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px; color: var(--navy); background: #fff; letter-spacing: 0.04em; }
.chip.r-R { background: var(--sky); color: #fff; }
.chip.r-E { background: var(--epic); }
.chip.r-L { background: var(--legend); }

/* 라인업 */
.court-slots { position: relative; aspect-ratio: 300 / 220; border-radius: 12px; overflow: hidden; }
.slots-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.slot { position: absolute; width: 27%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: 10px; background: rgba(27, 35, 80, 0.88); box-shadow: -6px 8px 0 rgba(27, 35, 80, 0.25); line-height: 1.15; }
.slot.filled { background: var(--navy); }
.slot b { font-size: 18px; font-weight: 900; }
.slot-pos { font-size: 10px; font-weight: 800; color: var(--ball); letter-spacing: 0.08em; }
.slot-nm { font-size: 12px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-add { font-size: 22px; font-weight: 300; color: var(--sky-2); line-height: 1.1; }
.slot-warn { font-size: 9px; color: var(--ball); font-weight: 700; }
.slot.s0 { left: 22%; top: 78%; }
.slot.s1 { left: 78%; top: 78%; }
.slot.s2 { left: 15%; top: 38%; }
.slot.s3 { left: 85%; top: 38%; }
.slot.s4 { left: 50%; top: 24%; }
.bench { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bslot { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; background: var(--deep); min-height: 62px; justify-content: center; line-height: 1.2; }
.bslot b { font-size: 15px; font-weight: 900; }
.bslot span { font-size: 11px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bslot small { font-size: 10px; color: var(--sky-2); font-weight: 700; }

/* 리그 */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--navy-3); }
.tbl td { padding: 9px 4px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.tbl .l { text-align: left; }
.tbl tr.me td { background: rgba(240, 138, 60, 0.13); font-weight: 800; }
.tbl tr.cut td { border-bottom: 2px dashed var(--sky); }
.tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.sched { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
.sched li { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
.sched li.cur { background: rgba(74, 159, 216, 0.16); border-radius: 8px; }
.sched li.bye { color: var(--muted); }
.sched .rd { font-size: 11px; font-weight: 800; color: var(--muted); }
.sched b.w { color: var(--sky-2); }
.sched b.l { color: var(--muted); }
.scores { list-style: none; margin: 0; padding: 0; }
.scores li { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.scores li span:first-child { text-align: right; color: var(--muted); }
.scores li span:last-child { color: var(--muted); }
.scores li span.win { color: var(--text); font-weight: 800; }
.scores b { font-variant-numeric: tabular-nums; }
.lead { list-style: none; counter-reset: ld; margin: 0; padding: 0; }
.lead li { counter-increment: ld; display: grid; grid-template-columns: 22px 1fr auto auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; cursor: pointer; }
.lead li::before { content: counter(ld); font-size: 12px; font-weight: 800; color: var(--muted); }
.lead li.me { color: var(--ball); }
.lead .tm { font-size: 12px; color: var(--muted); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; gap: 12px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.hist li span:last-child { margin-left: auto; color: var(--muted); }
.bracket .br-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.br-final { margin-top: 8px; }
.series { background: var(--deep); border-radius: 10px; padding: 10px; font-size: 13px; }
.series p { margin: 0 0 6px; font-size: 11px; }
.sr-row { display: flex; align-items: center; padding: 4px 0; color: var(--muted); }
.sr-row b { margin-left: auto; font-size: 16px; }
.sr-row.win { color: var(--text); font-weight: 800; }
.sr-row.me { color: var(--ball); }
.series .games { margin: 6px 0 0; color: var(--muted); font-size: 10px; }
.champ-line { text-align: center; font-weight: 800; margin: 12px 0 0; color: var(--legend); }

/* 모달 */
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal-bg { position: absolute; inset: 0; background: rgba(10, 13, 32, 0.7); opacity: 0; transition: opacity .2s; }
.sheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--navy); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(30px); opacity: 0; transition: transform .25s, opacity .25s; }
.modal.show .modal-bg { opacity: 1; }
.modal.show .sheet { transform: none; opacity: 1; }
.sheet .btn.big { margin-top: 16px; }
.pull-modal .sheet, .live-modal .sheet, .result-modal .sheet { min-height: 70vh; }

/* 선수 상세 */
.pd { display: flex; gap: 14px; }
.pd-card { width: 40%; flex: none; }
.pd-card .card { width: 100%; cursor: default; }
.pd-info h2 { font-size: 22px; }
.pd-info .en { margin: 0 0 8px; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.attrs { margin-top: 14px; display: grid; gap: 7px; }
.attr { display: grid; grid-template-columns: 58px 1fr 30px; gap: 8px; align-items: center; font-size: 13px; }
.attr span { color: var(--muted); }
.attr b { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--deep); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--sky-2)); border-radius: 99px; }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.statgrid.three { grid-template-columns: repeat(3, 1fr); }
.statgrid div { background: var(--navy-2); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; }
.statgrid b { font-size: 16px; font-variant-numeric: tabular-nums; }
.statgrid span { font-size: 11px; color: var(--muted); }

/* 선택 시트 */
.pick-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--navy-2); text-align: left; flex-wrap: wrap; }
.pick .nm { font-weight: 700; }
.pick .muted { font-size: 12px; margin-left: auto; }
.pick .warn { width: 100%; color: var(--ball); font-size: 11px; padding-left: 46px; margin-top: -4px; }

/* 카드 공개 */
.pull { text-align: center; }
.pull h2 { font-size: 18px; margin-bottom: 14px; }
.pull-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pull-cards.n1 { grid-template-columns: 1fr; width: 52%; margin: 0 auto; }
.flip { perspective: 600px; aspect-ratio: 3 / 4; cursor: pointer; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flip.open .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; overflow: hidden; }
.face.front { transform: rotateY(180deg); overflow: visible; }
.face.front .card { width: 100%; height: 100%; cursor: default; }
.back-art { width: 100%; height: 100%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3); border-radius: 10px; overflow: hidden; }
.back-art svg { width: 100%; height: 100%; display: block; }
.flip.r-L:not(.open) .back-art { box-shadow: 0 0 12px var(--ball), inset 0 0 0 2px var(--ball); animation: pulse 1s infinite alternate; }
.flip.r-E:not(.open) .back-art { box-shadow: inset 0 0 0 2px var(--epic); }
@keyframes pulse { to { box-shadow: 0 0 22px var(--ball), inset 0 0 0 2px var(--ball); } }
.flag { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font-size: 9px; font-weight: 800; background: var(--ball); color: #fff; padding: 2px 6px; border-radius: 99px; white-space: nowrap; z-index: 2; }
.pull-cards .card-top .ovr { font-size: 16px; }
.pull-cards .card-bottom .nm { font-size: 10px; }
.pull-cards .card-bottom .tm, .pull-cards .card-rar, .pull-cards .card-lv { display: none; }
.pull-cards .card-new { top: 5px; right: 4px; font-size: 7px; padding: 1px 3px; }
.pull-cards.n1 .card-new { top: 40px; right: 7px; font-size: 9px; padding: 1px 5px; }
.pull-cards.n1 .card-top .ovr { font-size: 26px; }
.pull-cards.n1 .card-bottom .nm { font-size: 16px; }
.pull-cards.n1 .card-bottom .tm, .pull-cards.n1 .card-rar { display: block; }

/* 라이브 */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
.sb-team .tlogo { width: 42px; height: 42px; font-size: 13px; }
.sb-score { font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.sb-score i { font-style: normal; color: var(--muted); font-size: 26px; }
.sb-clock { text-align: center; font-size: 12px; font-weight: 700; color: var(--ball); letter-spacing: 0.06em; }
.live-label { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 8px; }
.live-court { border-radius: 14px; overflow: hidden; }
.live-svg { width: 100%; display: block; }
#liveBall { transition: cx .35s ease-out, cy .35s ease-out; }
.ticker { list-style: none; margin: 10px 0 0; padding: 0; min-height: 132px; }
.ticker li { display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--navy-2); margin-bottom: 4px; animation: tin .25s; }
.ticker li.me { box-shadow: inset 3px 0 0 var(--ball); }
.ticker li small { color: var(--muted); font-size: 11px; }
.ticker li em { margin-left: auto; font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

/* 결과 */
.result { text-align: center; }
.result h2 { font-size: 30px; }
.result.won h2 { color: var(--sky-2); }
.result.lost h2 { color: var(--muted); }
.final { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 10px 0 14px; }
.final div { display: flex; align-items: center; gap: 10px; }
.final b { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
.final span { font-size: 14px; color: var(--muted); font-weight: 700; }
.final i { font-style: normal; color: var(--muted); font-size: 24px; }
.result .panel-head { margin-top: 16px; }
.qtbl td, .box td { padding: 6px 3px; }
.reward { font-weight: 800; font-size: 16px; color: var(--ball); margin: 16px 0 0; display: flex; align-items: center; justify-content: center; gap: 6px; }

/* 토스트 */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px); transform: translate(-50%, 20px); background: var(--white); color: var(--navy); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 99px; opacity: 0; transition: all .25s; z-index: 200; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 420px) {
  .cards { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

/* ===== v2: 팀 선택 / 로스터 / 시장 ===== */
body.no-scroll { overflow: hidden; }
.intro-art.short { height: 30vh; min-height: 190px; }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.team-tile { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; background: var(--deep); border: 2px solid transparent; }
.team-tile .tlogo { grid-row: 1 / span 2; width: 40px; height: 40px; font-size: 12px; }
.team-tile b { font-size: 13px; line-height: 1.2; }
.team-tile small { font-size: 11px; color: var(--sky-2); font-weight: 700; }
.team-tile em { grid-column: 1 / span 2; font-style: normal; font-size: 10px; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-tile.on { border-color: var(--sky); background: var(--navy-3); }
.hint { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.tbadge.me b { color: var(--ball); }
.packs.one { grid-template-columns: 1fr; }
.rules { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.rules span { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--navy-2); color: var(--muted); }

.bench-list, .mk-list { list-style: none; margin: 0; padding: 0; }
.bench-list li, .mk-list li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; font-size: 14px; }
.bench-list .nm, .mk-list .nm { flex: 1; font-weight: 700; display: flex; flex-direction: column; }
.bench-list .nm { flex-direction: row; align-items: center; gap: 4px; }
.bench-list small { color: var(--muted); font-size: 12px; }
.mk-list .nm small { font-weight: 500; color: var(--muted); font-size: 11px; }
.mk-list b { font-size: 13px; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.mk-list { max-height: 420px; overflow-y: auto; }
.fb { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 4px; vertical-align: 1px; margin-left: 2px; }
.fb.f { background: var(--ball); color: #fff; }
.fb.a { background: var(--epic); color: var(--navy); }
.mk-list .fb, .bench-list .fb { align-self: flex-start; }
.card-flag { position: absolute; top: 24px; right: 7px; font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 4px; background: var(--ball); color: #fff; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip-btn { flex: none; padding: 6px 11px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--deep); color: var(--muted); }
.chip-btn.on { background: var(--sky); color: #fff; }
.tac-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
.tac-row > span { font-size: 13px; color: var(--muted); font-weight: 700; flex: none; }

.pick:disabled { opacity: 0.4; }
.pick .cost { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 13px; }
.pick .muted { margin-left: 0; }
.pick .nm { flex: 1; }

/* ===== 경기 화면 ===== */
.match { position: fixed; inset: 0; z-index: 150; background: var(--deep); display: flex; justify-content: center; }
.mt { position: relative; width: 100%; max-width: 480px; height: 100%; background: var(--navy); display: flex; flex-direction: column; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); overflow: hidden; }
.mt-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.mt-team { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
.mt-team .tlogo { width: 34px; height: 34px; font-size: 11px; }
.mt-team.me b { color: var(--ball); }
.mt-pts { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; line-height: 1; }
.mt-pts i { font-style: normal; color: var(--muted); font-size: 22px; }
.mt-clock { text-align: center; font-size: 12px; font-weight: 800; color: var(--ball); letter-spacing: 0.06em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.mt-label { text-align: center; color: var(--muted); font-size: 11px; margin: 4px 0 6px; }
.mt-court { position: relative; border-radius: 14px; overflow: hidden; flex: 1; min-height: 0; display: flex; align-items: center; background: var(--navy); }
.mt-svg { width: 100%; height: 100%; display: block; }
.mt-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.8); font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(20, 26, 63, 0.6); opacity: 0; pointer-events: none; white-space: nowrap; }
.mt-banner.show { animation: bannerIn 1.3s ease-out; }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
.mt-feed { list-style: none; margin: 8px 0 0; padding: 0; min-height: 84px; }
.mt-feed li { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 5px 8px; border-radius: 8px; background: var(--navy-2); margin-bottom: 3px; animation: tin .25s; white-space: nowrap; overflow: hidden; }
.mt-feed li.me { box-shadow: inset 3px 0 0 var(--ball); }
.mt-feed small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.mt-feed em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding-left: 6px; }
.mt-five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.m5 { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; background: var(--navy-2); min-width: 0; }
.m5.star { box-shadow: inset 0 0 0 1.5px #ffd27a; }
.m5 b { font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m5 small { font-size: 10px; color: var(--muted); }
.m5-pos { font-size: 9px; font-weight: 800; color: var(--ball); letter-spacing: 0.06em; }
.m5-pos.b { color: var(--sky-2); }
.m5-st { display: block; width: 100%; max-width: 54px; height: 5px; border-radius: 99px; background: var(--deep); overflow: hidden; }
.m5-st i { display: block; height: 100%; background: #6fd39b; border-radius: 99px; transition: width .3s; }
.m5-st.mid i { background: #ffd27a; }
.m5-st.low i { background: #ff6b5e; }
.mt-ctrl { display: flex; gap: 6px; padding-top: 8px; }
.mt-ctrl .btn { padding: 12px 8px; font-size: 13px; }
.mt-q4 { flex: 1.4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--ball); background: rgba(240, 138, 60, 0.12); border-radius: 12px; }
.mt-panel, .mt-break { position: absolute; inset: 0; background: rgba(10, 13, 32, 0.55); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
.mt-panel.show, .mt-break.show { opacity: 1; pointer-events: auto; }
.mp-sheet, .mb-sheet { width: 100%; max-height: 74%; overflow-y: auto; background: var(--navy); border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.3); }
.mb-sheet { max-height: 80%; text-align: center; }
.mp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mp-tip { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.mp-tip.flash { animation: flash .6s; }
@keyframes flash { 30% { color: var(--ball); } }
.mp-list { display: flex; flex-direction: column; gap: 4px; }
.mp-row { display: flex; gap: 4px; }
.mp-main { flex: 1; display: grid; grid-template-columns: 28px 1fr 54px 64px; align-items: center; gap: 6px; padding: 8px; border-radius: 10px; background: var(--navy-2); text-align: left; min-width: 0; }
.mp-row.sel .mp-main { box-shadow: inset 0 0 0 2px var(--sky); background: var(--navy-3); }
.mp-nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-nm small { font-weight: 500; color: var(--muted); font-size: 11px; }
.mp-nm em { font-style: normal; color: var(--ball); }
.mp-stat { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mp-star { width: 38px; border-radius: 10px; background: var(--navy-2); color: var(--muted); font-size: 16px; }
.mp-star.on { background: #ffd27a; color: var(--navy); }
.mp-sub { font-size: 12px; font-weight: 800; color: var(--sky-2); margin: 12px 0 6px; }
.mp-help { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
.mp-auto { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 14px 0 4px; }

.mb-score { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 10px; }

.mb-sheet .btn.big { margin-top: 10px; }

/* ===== v3: 중계 HUD / 작전 지시 ===== */
.mt-hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.mt-live { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; color: #fff; background: #e5484d; padding: 3px 8px; border-radius: 99px; opacity: 0; transition: opacity .3s; }
.mt-live.on { opacity: 1; animation: livePulse 1.4s infinite; }
@keyframes livePulse { 50% { box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.25); } }
.mt-shot { min-width: 30px; text-align: center; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; color: #ffd27a; background: rgba(20, 26, 63, 0.85); border-radius: 8px; padding: 2px 6px; }
.mt-shot.low { color: #ff6b5e; }
.mt-pop { font-size: 7px; font-weight: 900; fill: #ffffff; paint-order: stroke; stroke: #1b2350; stroke-width: 1.2px; animation: popUp 1.1s ease-out forwards; }
.mt-pop.me { fill: #f08a3c; }
@keyframes popUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
.mt-feed { min-height: 58px; }
.mt-call { position: absolute; inset: 0; display: flex; align-items: flex-end; background: rgba(10, 13, 32, 0.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
.mt-call.show { opacity: 1; pointer-events: auto; }
.mc-sheet { width: 100%; background: var(--navy); border-radius: 18px 18px 0 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35); }
.mc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.mc-head b { font-size: 16px; color: var(--ball); }
.mc-head span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mc-btn { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px; border-radius: 12px; background: var(--navy-2); text-align: left; border: 1.5px solid transparent; }
.mc-btn b { font-size: 14px; }
.mc-btn small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.mc-btn.rec { border-color: var(--ball); }
.mc-btn i { position: absolute; top: 6px; right: 8px; font-style: normal; font-size: 9px; font-weight: 800; color: var(--navy); background: var(--ball); padding: 1px 5px; border-radius: 99px; }
.mc-btn:active { transform: scale(0.97); }
.mb-title { font-size: 18px; margin: 2px 0 6px; }
.mb-note { font-size: 12px; color: var(--ball); font-weight: 700; margin: 10px 0 0; }

/* ===== v4: 픽셀아트 경기 화면 ===== */
.mt.pixel { background: #0a0e26; padding-top: 8px; }
.mt.pixel .mt-court { flex: none; border-radius: 6px; background: #10163a; box-shadow: 0 0 0 2px #2a3366, 0 6px 0 #05081c; }
#mtCanvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.mt.pixel .mt-banner { top: 52%; font-family: "Courier New", ui-monospace, monospace; font-weight: 900; letter-spacing: 0.04em; color: #ffd27a; text-shadow: 2px 2px 0 #141026, -2px 2px 0 #141026, 2px -2px 0 #141026, -2px -2px 0 #141026, 0 4px 0 #141026; font-size: 24px; }
.mt-cutname { position: absolute; left: 0; right: 0; bottom: 10%; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s, transform .2s; }
.mt-cutname.show { opacity: 1; transform: none; }
.mt-cutname b { font-size: 20px; font-weight: 900; color: #fff; background: var(--tc, #4a9fd8); padding: 3px 12px; box-shadow: 3px 3px 0 #141026; border: 2px solid #141026; }
.mt-cutname small { font-size: 12px; font-weight: 800; color: #ffd27a; text-shadow: 1px 1px 0 #141026; background: rgba(20, 16, 38, 0.8); padding: 2px 8px; }
.mt.pixel .mt-feed li { border-radius: 4px; background: #141a3f; box-shadow: inset 0 0 0 1px #2a3366; }
.mt.pixel .m5 { border-radius: 4px; background: #141a3f; box-shadow: inset 0 0 0 1px #2a3366; }
.mt.pixel .mt-ctrl .btn { border-radius: 6px; }
.mt.pixel .mt-ctrl { margin-top: auto; }

/* ===== v7: 선수 기록 표시 ===== */
.m5 .m5-pts { font-size: 11px; color: var(--text); font-weight: 800; }
.m5-rec { display: flex; gap: 3px; font-size: 9px; color: var(--muted); font-weight: 700; }
.m5-rec i { font-style: normal; }
.m5-rec i.to, .mp-rec i.to { color: #ff8a80; }
.mp-main { grid-template-columns: 28px 1fr 44px auto; }
.mp-rec { display: grid; grid-template-columns: 20px 16px 16px 16px 20px; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }
.mp-rec b { color: var(--text); font-weight: 800; }
.mp-rec i { font-style: normal; }
.mp-rec.h { font-size: 10px; color: var(--sky-2); font-weight: 700; }
.mp-rec.h b { color: var(--sky-2); font-weight: 700; }
.mp-cols { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 4px; padding: 0 50px 0 8px; font-size: 12px; font-weight: 800; color: var(--sky-2); }
.mp-row:not(.court) .mp-main { margin-right: 42px; }
.pnum { font-style: normal; font-weight: 900; color: #ffd27a; margin-right: 3px; font-variant-numeric: tabular-nums; }
.m5 .pnum { font-size: 10px; margin-right: 2px; }

/* ===== v10: 플랫 일러스트 경기 화면 (GIF 스타일) ===== */
.mt.flat { background: #2a0b17; padding-top: 8px; }

.mt.flat .mt-banner { top: 52%; font-family: "Arial Black", Arial, sans-serif; font-weight: 900; color: #ffd27a; text-shadow: 0 3px 0 #24080f, 2px 0 0 #24080f, -2px 0 0 #24080f, 0 -2px 0 #24080f; font-size: 22px; }

.mt.flat .m5 { border-radius: 8px; background: #3d1222; }
.mt.flat .mt-ctrl { margin-top: auto; }
.mt.flat .mt-cutname b { box-shadow: none; border: 0; border-radius: 6px; }
.mt.flat .mt-cutname small { border-radius: 6px; background: rgba(36, 8, 15, 0.85); text-shadow: none; }

/* ===== v14: 타이틀 Korean Basketball League ===== */
.brand { min-width: 0; }
.brand-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; letter-spacing: -0.01em; }
.brand-team { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.gtitle { margin: 0 0 6px; font-size: 30px; line-height: 1.05; font-weight: 900; letter-spacing: -0.03em; }

/* ===== v15: 컬러칩 선수 카드 (흰 프레임 + 팀 색 창 + 캐릭터) ===== */
.card.pcard { aspect-ratio: 100 / 138; background: #f3f3f0; border-radius: 6px; overflow: hidden; container-type: inline-size;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(0, 0, 0, 0.06); color: #121212; }
.card.pcard::after { border-radius: 6px; box-shadow: none; }
.card.pcard.r-R::after { box-shadow: inset 0 0 0 2px var(--sky); }
.card.pcard.r-E::after { box-shadow: inset 0 0 0 2px var(--epic); }
.card.pcard.r-L { box-shadow: 0 0 16px rgba(246, 179, 122, 0.6), 0 6px 14px rgba(0, 0, 0, 0.45); }
.card.pcard.r-L::after { box-shadow: inset 0 0 0 3px var(--legend); }
.pc-art { position: absolute; left: 0; right: 0; top: 0; height: 67%; }
.pc-art svg { width: 100%; height: 100%; display: block; }
.pc-rar, .pc-flag { position: absolute; top: calc(67% - 10cqw); font-size: 7px; font-size: 6.4cqw; font-weight: 900; letter-spacing: 0.06em; padding: 0.15em 0.45em; border-radius: 3px; line-height: 1.3; }
.pc-rar { right: 8.5%; background: rgba(255, 255, 255, 0.9); color: #121212; }
.r-R .pc-rar { background: var(--sky); color: #fff; }
.r-E .pc-rar { background: var(--epic); color: #121212; }
.r-L .pc-rar { background: var(--legend); color: #121212; }
.pc-flag { left: 8.5%; background: var(--ball); color: #fff; }
.pc-label { position: absolute; left: 0; right: 0; bottom: 0; height: 33%; padding: 4% 7% 0; display: flex; flex-direction: column; justify-content: flex-start; }
.pc-label .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; line-height: 1.1; }
.pc-label .nm { font-size: 12px; font-size: 11.5cqw; font-weight: 900; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-label .ovr { font-size: 13px; font-size: 12.5cqw; font-weight: 900; font-variant-numeric: tabular-nums; }
.pc-label .l2 { display: flex; justify-content: space-between; font-size: 8.5px; font-size: 7.8cqw; font-weight: 600; color: #2b2b2b; margin-top: 0.3em; white-space: nowrap; }
.pc-label .l2 span { overflow: hidden; text-overflow: ellipsis; }
.pc-label .l2 em { font-style: normal; font-weight: 900; color: #121212; padding-left: 4px; }
.pc-label .l3 { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 7px; font-size: 6.4cqw; font-weight: 600; color: #7a7a7a; margin-top: 0.35em; white-space: nowrap; }
.pc-label .l3 span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-label .sw { display: flex; flex: none; }
.pc-label .sw i { width: 4.6cqw; height: 3.4cqw; min-width: 4px; min-height: 3px; display: block; }

/* ===== v16: 인트로 표지 · 스카우트 연출 · 접는 확률 · 보상/성장 ===== */
.cover { position: relative; height: 46vh; min-height: 280px; max-height: 400px; overflow: hidden; background: #3d1222; }
.cover svg { width: 100%; height: 100%; display: block; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #1b0a12 0%, rgba(27, 10, 18, 0.55) 26%, rgba(27, 10, 18, 0) 50%); pointer-events: none; }
.cover-title { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 1; }
.cover-title p { margin: 0 0 4px; font-size: 11px; font-weight: 900; letter-spacing: 0.22em; color: #ffd27a; }
.cover-title .gtitle { margin: 0; font-size: 36px; color: #fff; text-shadow: 0 3px 0 #24080f; }

/* 스카우트 카드 등장: 작게 뒤집혀 있다가 '뿅' 커지며 앞면, 높은 등급은 빛이 퍼짐 */
.card.pop { opacity: 0; animation: cardPop 0.62s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes cardPop {
  0% { opacity: 0; transform: translateY(26px) scale(0.2) rotateY(180deg); filter: brightness(3); }
  55% { opacity: 1; transform: translateY(-6px) scale(1.12) rotateY(0); filter: brightness(1.6); }
  75% { transform: scale(0.96); filter: brightness(1); }
  100% { opacity: 1; transform: none; filter: none; }
}
.card.pop.r-L, .card.pop.r-E { animation-name: cardPopRare; animation-duration: 0.9s; }
@keyframes cardPopRare {
  0% { opacity: 0; transform: translateY(26px) scale(0.2) rotateY(180deg); filter: brightness(3); box-shadow: 0 0 0 0 rgba(255, 210, 122, 0); }
  50% { opacity: 1; transform: translateY(-8px) scale(1.16) rotateY(0); filter: brightness(1.8); box-shadow: 0 0 40px 14px rgba(255, 210, 122, 0.85); }
  75% { transform: scale(0.97); filter: brightness(1.1); }
  100% { opacity: 1; transform: none; filter: none; }
}
.scout-cards { perspective: 600px; }

/* 접었다 펴는 패널 */
details.panel > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary h3 { margin: 0; font-size: 15px; }
details.panel > summary::after { content: "▾"; color: var(--muted); font-size: 14px; transition: transform 0.2s; }
details.panel[open] > summary::after { transform: rotate(180deg); }
details.panel[open] > summary { margin-bottom: 10px; }
.rates small { color: var(--ball); font-weight: 800; font-size: 11px; }
.rw-info summary { font-size: 13px; font-weight: 800; color: var(--text); }
.panel.tips.rw-info p { text-align: left; margin: 6px 0 0; line-height: 1.55; }
.panel.tips.rw-info p b { color: var(--text); }

/* 결과: 보상 내역 · 성장 */
.rw-lines { list-style: none; margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); }
.rw-lines li { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--muted); }
.rw-lines li b { color: var(--ball); }
.grow-list { list-style: none; margin: 0; padding: 0; }
.grow-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.grow-list .nm { font-weight: 800; flex: 1; }
.grow-list b { color: #6fd39b; }
.grow-box { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(111, 211, 155, 0.1); font-size: 13px; }
.grow-box b { color: #6fd39b; }
.grow-box .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); margin: 6px 0 4px; overflow: hidden; }
.grow-box .bar i { display: block; height: 100%; background: #6fd39b; }
.grow-box small { color: var(--muted); font-size: 11px; }
.lead li.top5 b { color: #ffd27a; }
.lead-note { margin: 0 0 8px; }
.tbl tr.bye td:first-child { color: #ffd27a; font-weight: 900; }
/* 인트로 본문도 경기 화면처럼 자주색 톤 */
.intro { background: #2a0b17; }
.intro .team-tile { background: #3d1222; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
.intro .team-tile.on { background: #5c1f38; }
.intro .seg { background: #3d1222; }
.intro .eyebrow { color: #ffd27a; }

  var players = RAW.split('\n').map(function (line) {
    var f = line.split('|');
    var n = function (i) { return +f[i] || 0; };
    return {
      id: f[0], name: f[1].trim(), ename: f[2].trim(), team: f[3], num: f[4], pos: f[5],
      height: n(6), weight: n(7), flag: f[8], draft: draftLabel(f[9]), draftRaw: f[9],
      s: {
        gp: n(10), min: n(11), pts: n(12), reb: n(13), oreb: n(14), ast: n(15), stl: n(16),
        blk: n(17), tov: n(18), tpm: n(19), tpa: n(20), fgm: n(21), fga: n(22), ftm: n(23), fta: n(24)

  /* ---------- 능력치 계산 ----------
   * 슈팅/골밑/패스/리바/수비 5개 능력치 + 종합(OVR)
   * 36분당 기록을 포지션별 기준치와 출전시간 신뢰도로 섞은 뒤 전체 선수 백분위로 환산 */
  var BASE = {
    GD: { pts: 10, reb: 3.5, oreb: 0.8, ast: 3.2, stl: 1.1, blk: 0.1, tov: 2, tpm: 1.4, fg2: 2.6, fta: 1.8 },
    FD: { pts: 10, reb: 6, oreb: 1.6, ast: 1.6, stl: 0.9, blk: 0.4, tov: 1.5, tpm: 1.2, fg2: 3, fta: 2 },
    C: { pts: 10, reb: 9, oreb: 3, ast: 1.1, stl: 0.6, blk: 1, tov: 1.6, tpm: 0.2, fg2: 4.4, fta: 2.6 }
  };

  function pctRank(arr, key) {
    var sorted = arr.map(function (p) { return p._r[key]; }).sort(function (a, b) { return a - b; });
    arr.forEach(function (p) {
      var v = p._r[key], lo = 0, hi = sorted.length;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (sorted[mid] < v) lo = mid + 1; else hi = mid; }
      var lo2 = lo; while (lo2 < sorted.length && sorted[lo2] === v) lo2++;

    var ft = (s.ftm + 0.72 * 8) / (s.fta + 8);
    var fg2m = s.fgm - s.tpm, fg2a = s.fga - s.tpa;
    var p2 = (fg2m + 0.48 * 10) / (fg2a + 10);
    var tpm = mix(s.tpm, b.tpm), fg2 = mix(fg2m, b.fg2), fta = mix(s.fta, b.fta);
    var reb = mix(s.reb, b.reb), oreb = mix(s.oreb, b.oreb), ast = mix(s.ast, b.ast);
    var stl = mix(s.stl, b.stl), blk = mix(s.blk, b.blk), tov = mix(s.tov, b.tov), pts = mix(s.pts, b.pts);

    p._r = {
      sht: tpm * 0.9 + (p3 - 0.3) * 14 + (ft - 0.72) * 5 + pts * 0.07,
      ins: fg2 * 0.8 + (p2 - 0.48) * 10 + oreb * 0.5 + fta * 0.35 + (h - 192) * 0.05,
      ply: ast - tov * 0.35,
      reb: reb + oreb * 0.4 + (h - 192) * 0.04,
      def: stl * 1.4 + blk * 1.6 + (h - 188) * 0.035 + (reb - oreb) * 0.08
    };
    // 생산성(Game Score/경기) – 출전 경기 수가 적으면 기준치 쪽으로 수축
    var gs = s.pts + 0.4 * s.fgm - 0.7 * s.fga - 0.4 * (s.fta - s.ftm) + 0.7 * s.oreb +
      0.3 * (s.reb - s.oreb) + s.stl + 0.7 * s.ast + 0.7 * s.blk - s.tov;
    var pedigree = 1.2;
    var dm = (p.draftRaw || '').match(/(\d)R(?: (\d+))?/);
    if (dm && dm[1] === '1') pedigree = 2.4 - (+dm[2] || 10) * 0.08;
    if (p.flag === '1') pedigree = 6;
    if (p.flag === '2') pedigree = 3.5;
    p._r.prod = (gs + pedigree * 8) / (s.gp + 8);

  players.forEach(function (p) {

    var at = function (pc) { return Math.round(38 + 58 * Math.pow(pc, 0.85)); };

    var attrAvg = (p.a.sht + p.a.ins + p.a.ply + p.a.reb + p.a.def) / 5;

  var ranked = players.slice().sort(function (a, b) { return b.ovr - a.ovr || b.s.pts - a.s.pts; });

  var TH = {
    L: Math.min.apply(null, ranked.slice(0, 12).map(function (p) { return p.ovr; })),
    E: Math.min.apply(null, ranked.slice(12, 40).map(function (p) { return p.ovr; })),
    R: Math.min.apply(null, ranked.slice(40, 90).map(function (p) { return p.ovr; }))
  };
  // 등급이 높을수록 능력치 보너스 (OVR·5개 능력치에 더함)
  var RBONUS = { L: 3, E: 2, R: 1, C: 0 };
  players.forEach(function (p) { p.base = { ovr: p.ovr, a: JSON.parse(JSON.stringify(p.a)) }; });
  function rarityOf(raw) { return raw >= TH.L ? 'L' : raw >= TH.E ? 'E' : raw >= TH.R ? 'R' : 'C'; }

  function refresh(p, g) {
    g = g || 0;
    if (!p.rarity0) p.rarity0 = p.rarity;
    var ORD = 'CREL', raw = p.base.ovr + g, r = rarityOf(raw);
    if (ORD.indexOf(r) < ORD.indexOf(p.rarity0)) r = p.rarity0; // 시작 등급(순위 기준) 아래로는 안 내려감
    var b = RBONUS[r];
    p.rarity = r; p.growth = g;
    p.ovr = Math.min(99, raw + b);
    Object.keys(p.base.a).forEach(function (k) { p.a[k] = Math.min(99, p.base.a[k] + g + b); });
    return p;
  }
  players.forEach(function (p) { refresh(p, 0); });

  window.KBL = {
    TEAMS: TEAMS, PLAYERS: players, POS_LABEL: POS_LABEL, POS_SHORT: POS_SHORT, FLAG_LABEL: FLAG_LABEL,
    byId: players.reduce(function (m, p) { m[p.id] = p; return m; }, {}),
    RARITY_TH: TH, RARITY_BONUS: RBONUS, refresh: refresh, rarityOf: rarityOf
  };
})();

        front = bigHoop(c.rimX + sh, c.rimY + (k > impact ? 2 : 0) + sh, k, k > impact && k < impact + 0.35 ? 1 : 0);
      } else {
        tt = lerp(0.2, 0.62, clamp(k / 0.45, 0, 1));
        mt = cutFig(c, 'shoot', tt);
      }
      F.draw(ctx, mt, baseX, baseY, KC);
      // 공 (3배)
      var bx, by;
      function W(pt) { return [baseX + (pt[0] - window.CHIBI.VBW / 2) * KC, baseY - (C_G - pt[1]) * KC]; }
      var hold = mt.ballAt ? W(mt.ballAt) : W(mt.hands.r);
      if (c.kind === 'dunk') {
        if (k <= impact) { bx = hold[0]; by = hold[1]; }
        else { bx = c.rimX; by = c.rimY + 6 + (k - impact) * 170; }
      } else {
        var rel = 0.34;
        if (k < rel) { bx = hold[0]; by = hold[1]; c.relX = bx; c.relY = by; }
        else { var kk = (k - rel) / (1 - rel); bx = lerp(c.relX, 210, kk); by = lerp(c.relY, 30, kk) - Math.sin(Math.PI * Math.min(1, kk * 0.9)) * 60; }
      }
      if (c.kind !== 'dunk' || k <= impact || by < VH) F.ball(ctx, bx, by, BR * 3, now / 140);
      if (front) front();
      if (k > impact && k < impact + 0.06) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(0, 0, VW, VH); }
      // 레터박스 + 타이틀
      ctx.fillStyle = '#12040a'; ctx.fillRect(0, 0, VW, 14); ctx.fillRect(0, VH - 14, VW, 14);
      if (k > 0.12) {
        var jig = k > impact && k < impact + 0.2 ? (Math.random() - 0.5) * 2 : 0;
        FA.txt(ctx, c.title, VW / 2 + jig, 19 + jig, 15, '#ffd27a', 'center', '#24080f');
      }
      if (c.kind !== 'dunk' && k > 0.45) FA.txt(ctx, c.dist + 'M', VW - 8, 40, 9, '#ffffff', 'right', '#24080f');
      drawScoreboard(now);
    }

    // 시작
    teleport();
    var p0 = sp(pos[m.poss][0].x, pos[m.poss][0].y);
    ball.gx = p0[0]; ball.gy = p0[1]; ball.h = 12;
    st.camX = clamp(p0[0] - VW / 2, 0, X.WW - VW);
    paintFive(); paintCtrl();
    banner('1쿼터');
    requestAnimationFrame(frame);
  }

  window.MatchUI = { open: open };
})();

  <script>
/* KBL 카드 리그 – 앱 로직 (팀 선택 · 12인 로스터 · 스카우트/트레이드 · 시즌) */
(function () {
  var K = window.KBL, A = window.ART, S = window.SIM;
  var SAVE_KEY = 'kbl-card-league-v2';
  var RARITY = {
    L: { label: 'LEGEND', ko: '레전드', rate: 0.02 },
    E: { label: 'EPIC', ko: '에픽', rate: 0.10 },
    R: { label: 'RARE', ko: '레어', rate: 0.30 },
    C: { label: 'COMMON', ko: '커먼', rate: 0.58 }
  };
  var ROSTER = 12, MAX_F = 2, MAX_A = 1, SCOUT_COST = 150, SCOUT_REFUND = 50;
  var DIFF = { rookie: { ko: '루키', ai: -0.05 }, pro: { ko: '프로', ai: -0.025 }, mvp: { ko: 'MVP', ai: 0 } };
  // 보상: 경기 승패 / 정규리그 최종 순위 / 플레이오프 성적 / 개인 기록 랭커(라운드마다)
  var REWARD = {
    win: 300, loss: 120, poWin: 500,
    rank: [2000, 1500, 1200, 900, 700, 500, 300, 300, 300, 300],
    po: { champ: 3000, runner: 1500, semi: 800, qf: 400 },
    leaderTop: 50, leader: 20
  };
  var LEGS = 3, PO_TEAMS = 6;           // 정규리그 27경기(3라운드 로빈), 6강 플레이오프
  var XP_PER = 14, G_MAX = 10;          // 경기 활약 경험치 14마다 OVR +1, 최대 +10
  var STAGE_NAME = { qf: '6강 플레이오프', semi: '4강 플레이오프', final: '챔피언결정전' };
  var TEAM_IDS = Object.keys(K.TEAMS);
  var TAC_LABEL = {
    tempo: [['fast', '빠르게'], ['normal', '보통'], ['slow', '느리게']],
    focus: [['inside', '골밑'], ['bal', '밸런스'], ['outside', '외곽']],
    def: [['man', '대인'], ['zone', '지역'], ['press', '압박']]
  };

  var state = null;
  var ui = { tab: 'home', leagueTab: 'stand', mkTeam: 'all', mkPos: 'all', pickTeam: null, diff: 'pro' };
  var $app = document.getElementById('app');

  /* ---------- 저장 ---------- */
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { } }
  function load() {
    try { var t = localStorage.getItem(SAVE_KEY); if (t) { var s = JSON.parse(t); if (s && s.v === 2) return s; } } catch (e) { }
    return null;
  }

  /* ---------- 유틸 ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return n.toLocaleString('ko-KR'); }
  function my() { return state.myTeam; }
  function isMe(tid) { return tid === state.myTeam; }
  function teamName(tid) { return K.TEAMS[tid].name; }
  function teamShort(tid) { return K.TEAMS[tid].short; }
  function teamColor(tid) { return K.TEAMS[tid].color; }
  function myRoster() { return state.rosters[my()]; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('show'); }, 10);
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 2200);
  }
  function flagBadge(p) { return p.flag === '1' ? '<span class="fb f">외국</span>' : p.flag === '2' ? '<span class="fb a">아시아</span>' : ''; }

  /* ---------- 로스터 규칙 ---------- */
  function quota(ids) { var f = 0, a = 0; ids.forEach(function (id) { var fl = K.byId[id].flag; if (fl === '1') f++; else if (fl === '2') a++; }); return { f: f, a: a }; }
  function okQuota(ids) { var q = quota(ids); return q.f <= MAX_F && q.a <= MAX_A; }
  function ownerOf(pid) {
    for (var i = 0; i < TEAM_IDS.length; i++) if (state.rosters[TEAM_IDS[i]].indexOf(pid) >= 0) return TEAM_IDS[i];
    return 'FA';
  }
  function ownerShort(o) { return o === 'FA' ? '미등록' : teamShort(o); }
  function initRosters() {
    var rosters = {}, reserve = [];
    TEAM_IDS.forEach(function (tid) {
      var r = [], f = 0, a = 0;
      K.PLAYERS.filter(function (p) { return p.team === tid; }).sort(function (x, y) { return y.ovr - x.ovr; }).forEach(function (p) {
        if (r.length >= ROSTER || (p.flag === '1' && f >= MAX_F) || (p.flag === '2' && a >= MAX_A)) { reserve.push(p.id); return; }
        r.push(p.id); if (p.flag === '1') f++; if (p.flag === '2') a++;
      });
      rosters[tid] = r;
    });
    return { rosters: rosters, reserve: reserve };
  }
  /* AI 팀이 선수를 잃으면 미등록 선수 중 규정에 맞는 최고 선수로 채움 */
  function refill(tid) {
    var r = state.rosters[tid];
    while (r.length < ROSTER) {
      var best = null;
      state.reserve.forEach(function (id) { if (okQuota(r.concat([id])) && (!best || K.byId[id].ovr > K.byId[best].ovr)) best = id; });
      if (!best) break;
      state.reserve.splice(state.reserve.indexOf(best), 1); r.push(best);
    }
    delete aiCache[tid];
  }
  function price(p) { return Math.round((Math.pow(Math.max(0, p.ovr - 55), 2) * 2.2 + 100) / 10) * 10; }
  function tradeCost(pid, outId) { return Math.max(100, price(K.byId[pid]) - Math.round(price(K.byId[outId]) * 0.05) * 10); }
  /* 영입: pid를 데려오고 outId를 내보냄 (내보낸 선수는 미등록으로) */
  function acquire(pid, outId, cost) {
    var from = ownerOf(pid), r = myRoster();
    if (from === my()) return false;
    var next = r.filter(function (id) { return id !== outId; }).concat([pid]);
    if (next.length !== ROSTER || !okQuota(next)) return false;
    if (state.coins < cost) return false;
    state.coins -= cost;
    if (from === 'FA') state.reserve.splice(state.reserve.indexOf(pid), 1);
    else state.rosters[from].splice(state.rosters[from].indexOf(pid), 1);
    r.splice(r.indexOf(outId), 1, pid);
    state.reserve.push(outId);
    var si = state.starters.indexOf(outId);
    if (si >= 0) state.starters[si] = pid;
    if (state.shooter === outId) state.shooter = null;
    if (from !== 'FA') refill(from);
    return true;
  }

  /* ---------- 라인업 ---------- */
  function bestAssign(ids, slots, ovrFn) {
    var cand = ids.slice().sort(function (a, b) { return ovrFn(b) - ovrFn(a); }).slice(0, 12);
    var bestSum = -1, bestPick = [], pick = [], used = {};
    function dfs(k, sum) {
      if (k === slots.length) { if (sum > bestSum) { bestSum = sum; bestPick = pick.slice(); } return; }
      for (var i = 0; i < cand.length; i++) {
        var id = cand[i]; if (used[id]) continue;
        used[id] = 1; pick[k] = id;
        dfs(k + 1, sum + ovrFn(id) * S.fitPenalty(K.byId[id].pos, S.SLOT_POS[slots[k]]));
        used[id] = 0;
      }
    }
    dfs(0, 0);
    return bestPick;
  }
  function ovr(id) { return K.byId[id].ovr; }
  function autoLineup() { state.starters = bestAssign(myRoster(), [0, 1, 2, 3, 4], ovr); }
  function benchIds() { return myRoster().filter(function (id) { return state.starters.indexOf(id) < 0; }).sort(function (a, b) { return ovr(b) - ovr(a); }); }
  function lineupOvr(starters) {
    var s = 0; starters.forEach(function (id, i) { s += ovr(id) * S.fitPenalty(K.byId[id].pos, S.SLOT_POS[i]); });
    return Math.round(s / 5);
  }
  var aiCache = {};
  function aiStarters(tid) {
    var key = state.rosters[tid].join(',');
    if (!aiCache[tid] || aiCache[tid].key !== key) aiCache[tid] = { key: key, st: bestAssign(state.rosters[tid], [0, 1, 2, 3, 4], ovr) };
    return aiCache[tid].st;
  }
  function startersOf(tid) { return isMe(tid) ? state.starters : aiStarters(tid); }
  function teamOvr(tid) { return lineupOvr(startersOf(tid)); }
  function matchCfg(tid) {
    if (isMe(tid)) return { tid: tid, roster: myRoster(), starters: state.starters, shooter: state.shooter, tac: JSON.parse(JSON.stringify(state.tac)), auto: true, mod: 0 };
    return { tid: tid, roster: state.rosters[tid], starters: aiStarters(tid), shooter: null, tac: { tempo: 'normal', focus: 'bal', def: 'man' }, auto: true, mod: DIFF[state.diff].ai };
  }

  /* ---------- 시즌 ---------- */
  function resetGrowth() { K.PLAYERS.forEach(function (p) { K.refresh(p, 0); }); }
  function newGame(tid, diff) {
    resetGrowth();
    var r = initRosters();
    state = {
      v: 2, myTeam: tid, diff: diff, coins: 1000, rosters: r.rosters, reserve: r.reserve,
      starters: [], shooter: null, tac: { tempo: 'normal', focus: 'bal', def: 'man' },
      seasonNo: 1, season: null, history: [], scout: null, growth: {}
    };
    autoLineup();
    newSeason();
  }
  function newSeason() {
    state.season = { no: state.seasonNo, teams: TEAM_IDS.slice(), rounds: S.makeSchedule(shuffle(TEAM_IDS.slice()), LEGS), round: 0, phase: 'regular', stats: {}, playoff: null, champion: null, myLog: [] };
  }
  /* 예전 저장(18경기·4강) 이어하기: 정규리그 중이면 세 번째 바퀴(9경기)를 붙여 27경기로 */
  function migrate() {
    if (!state) return;
    state.growth = state.growth || {};
    var s = state.season;
    if (s && s.phase === 'regular' && s.rounds.length === 18) {
      for (var i = 0; i < 9; i++) s.rounds.push({ round: 19 + i, games: s.rounds[i].games.map(function (g) { return { home: g.home, away: g.away }; }) });
    }
    Object.keys(state.growth).forEach(function (id) { if (K.byId[id]) K.refresh(K.byId[id], state.growth[id].g); });
  }

  /* ---------- 성장: 내 팀 선수가 잘하면 경험치 → OVR 상승 → 등급 상승 ---------- */
  function perfScore(b) { return b.pts + b.reb * 0.8 + b.ast + (b.stl || 0) + (b.blk || 0) - (b.tov || 0) - (b.fga - b.fgm) * 0.35; }
  function growFromBox(box) {
    var ups = [];
    box.forEach(function (b) {
      if (!b.min || myRoster().indexOf(b.id) < 0) return;
      var perf = perfScore(b), xp = perf >= 34 ? 3 : perf >= 26 ? 2 : perf >= 18 ? 1 : 0;
      if (!xp) return;
      var gr = state.growth[b.id] || (state.growth[b.id] = { g: 0, xp: 0 }), p = K.byId[b.id];
      if (gr.g >= G_MAX) return;
      gr.xp += xp;
      var from = p.ovr, rFrom = p.rarity, up = false;
      while (gr.xp >= XP_PER && gr.g < G_MAX) { gr.xp -= XP_PER; gr.g++; up = true; }
      if (up) { K.refresh(p, gr.g); ups.push({ id: b.id, from: from, to: p.ovr, rFrom: rFrom, rTo: p.rarity }); }
    });
    if (ups.length) aiCache = {};
    return ups;
  }
  /* 개인 기록 랭커: 득점·리바·어시·3점 각 상위 5명 안의 내 선수마다 코인 */
  function leaderBoards() {
    var arr = Object.keys(state.season.stats).map(function (k) { return state.season.stats[k]; });
    var maxGp = arr.reduce(function (m, x) { return Math.max(m, x.gp); }, 0);
    var q = arr.filter(function (x) { return x.gp >= Math.max(1, Math.floor(maxGp * 0.4)); });
    return [['pts', '득점'], ['reb', '리바운드'], ['ast', '어시스트'], ['tpm', '3점슛']].map(function (c) {
      return { key: c[0], name: c[1], top: q.slice().sort(function (a, b) { return b[c[0]] / b.gp - a[c[0]] / a.gp; }).slice(0, 10) };
    });
  }
  function leaderReward() {
    var lines = [];
    leaderBoards().forEach(function (bd) {
      bd.top.slice(0, 5).forEach(function (x, i) {
        if (!isMe(x.t)) return;
        lines.push([K.byId[x.id].name + ' ' + bd.name + ' ' + (i + 1) + '위', i === 0 ? REWARD.leaderTop : REWARD.leader]);
      });
    });
    return lines;
  }
  function simGame(home, away) { return new S.Match(matchCfg(home), matchCfg(away)).runToEnd().result(); }
  function slim(res) { return { score: res.score, quarters: res.quarters, ot: res.ot }; }
  function addStats(home, away, res) {
    var st = state.season.stats;
    [home, away].forEach(function (tid, side) {
      res.box[side].forEach(function (b) {
        if (!b.min) return;
        var k = tid + ':' + b.id;
        var r = st[k] || (st[k] = { t: tid, id: b.id, gp: 0, pts: 0, reb: 0, ast: 0, tpm: 0 });
        r.gp++; r.pts += b.pts; r.reb += b.reb; r.ast += b.ast; r.tpm += b.tpm;
      });
    });
  }
  function currentRound() { return state.season.rounds[state.season.round]; }
  function myGameIn(round) {
    if (!round) return null;
    for (var i = 0; i < round.games.length; i++) { var g = round.games[i]; if (isMe(g.home) || isMe(g.away)) return g; }
    return null;
  }
  function allResults() { var arr = []; state.season.rounds.forEach(function (r) { r.games.forEach(function (g) { arr.push(g); }); }); return arr; }
  function table() { return S.standings(state.season.teams, allResults()); }

  /* 정규리그 끝 → 최종 순위 보상 + 6강 플레이오프 (3위-6위, 4위-5위 / 1·2위는 4강 직행, 모두 5전 3승제) */
  function startPlayoffs() {
    var st = table(), s = state.season;
    var seeds = st.slice(0, PO_TEAMS).map(function (x) { return x.id; });
    s.phase = 'playoff';
    s.playoff = { seeds: seeds, stage: 'qf', qf: [mkSeries(seeds[2], seeds[5], 3), mkSeries(seeds[3], seeds[4], 3)], semi: null, final: null };
    s.myRank = st.map(function (x) { return x.id; }).indexOf(my()) + 1;
    var bonus = REWARD.rank[s.myRank - 1] || 0;
    state.coins += bonus; s.rankBonus = bonus;
    return [['정규리그 최종 ' + s.myRank + '위', bonus]];
  }
  function mkSeries(a, b, need) { return { a: a, b: b, w: [0, 0], need: need, games: [] }; }
  function seriesDone(sr) { return sr.w[0] >= sr.need || sr.w[1] >= sr.need; }
  function seriesWinner(sr) { return sr.w[0] >= sr.need ? sr.a : sr.w[1] >= sr.need ? sr.b : null; }
  function seriesHome(sr) {
    var gn = sr.games.length;
    var top = sr.need === 3 ? [0, 1, 4].indexOf(gn) >= 0 : [0, 2].indexOf(gn) >= 0;
    return top ? [sr.a, sr.b] : [sr.b, sr.a];
  }
  function activeSeries() {
    var po = state.season.playoff; if (!po) return [];
    var list = po.stage === 'qf' ? po.qf : po.stage === 'semi' ? po.semi : po.final ? [po.final] : [];
    return list.filter(function (sr) { return !seriesDone(sr); });
  }
  function mySeries() { return activeSeries().filter(function (sr) { return isMe(sr.a) || isMe(sr.b); })[0] || null; }
  function applySeries(sr, home, away, res) {
    var winner = res.score[0] > res.score[1] ? home : away;
    sr.w[winner === sr.a ? 0 : 1]++;
    sr.games.push({ home: home, away: away, result: slim(res) });
    addStats(home, away, res);
  }
  function simOtherSeries(except) {
    activeSeries().forEach(function (sr) {
      if (sr === except) return;
      var ha = seriesHome(sr); applySeries(sr, ha[0], ha[1], simGame(ha[0], ha[1]));
    });
  }
  /* 단계가 끝나면 다음 대진을 만들고, 내 팀이 탈락했으면 그 단계 보상을 줌. 반환: 보상 줄 목록 */
  function lostIn(list) { return list.some(function (sr) { return (isMe(sr.a) || isMe(sr.b)) && !isMe(seriesWinner(sr)); }); }
  function seedOf(tid) { return state.season.playoff.seeds.indexOf(tid); }
  function checkStage() {
    var po = state.season.playoff, lines = [];
    if (po.stage === 'qf' && po.qf.every(seriesDone)) {
      var w = po.qf.map(seriesWinner).sort(function (a, b) { return seedOf(a) - seedOf(b); });
      po.stage = 'semi';
      po.semi = [mkSeries(po.seeds[0], w[1], 3), mkSeries(po.seeds[1], w[0], 3)]; // 1위는 남은 팀 중 낮은 시드와
      if (lostIn(po.qf)) { state.coins += REWARD.po.qf; lines.push(['6강 플레이오프 진출', REWARD.po.qf]); }
    } else if (po.stage === 'semi' && po.semi.every(seriesDone)) {
      var a = seriesWinner(po.semi[0]), b = seriesWinner(po.semi[1]);
      if (seedOf(b) < seedOf(a)) { var t = a; a = b; b = t; }
      po.stage = 'final';
      po.final = mkSeries(a, b, 3);
      if (lostIn(po.semi)) { state.coins += REWARD.po.semi; lines.push(['4강 진출', REWARD.po.semi]); }
    } else if (po.stage === 'final' && seriesDone(po.final)) lines = lines.concat(finishSeason());
    return lines;
  }
  function finishSeason() {
    var s = state.season, po = s.playoff;
    s.champion = seriesWinner(po.final);
    s.phase = 'done';
    var finalist = isMe(po.final.a) || isMe(po.final.b);
    var bonus = isMe(s.champion) ? REWARD.po.champ : finalist ? REWARD.po.runner : 0;
    state.coins += bonus; s.bonus = bonus;
    state.history.push({ no: s.no, rank: s.myRank, champion: teamName(s.champion), me: isMe(s.champion), finalist: finalist });
    return bonus ? [[isMe(s.champion) ? '챔피언 우승' : '준우승', bonus]] : [];
  }
  function toastLines(lines) { lines.forEach(function (l, i) { setTimeout(function () { toast(l[0] + ' +' + fmt(l[1]) + '코인'); }, i * 900); }); }

  /* ---------- 내 경기 진행 (경기 화면) ---------- */
  function openMatch(home, away, label, done) {
    if (window.__KCL_FAST) { done(simGame(home, away)); return; } // 테스트용: 경기 화면 없이 바로 결과
    var m = new S.Match(matchCfg(home), matchCfg(away));
    window.MatchUI.open(m, { me: isMe(home) ? 0 : 1, ids: [home, away], shorts: [teamShort(home), teamShort(away)], colors: [teamColor(home), teamColor(away)], label: label }, done);
  }
  function afterMyGame(home, away, res, label) {
    var meSide = isMe(home) ? 0 : 1, won = res.score[meSide] > res.score[1 - meSide];
    var coins = won ? (state.season.phase === 'playoff' ? REWARD.poWin : REWARD.win) : REWARD.loss;
    state.coins += coins;
    state.season.myLog.push({ label: label, opp: meSide === 0 ? away : home, my: res.score[meSide], op: res.score[1 - meSide], won: won });
    if (state.season.myLog.length > 40) state.season.myLog.shift();
    var ups = growFromBox(res.box[meSide]);
    return { home: home, away: away, res: res, meSide: meSide, won: won, coins: coins, label: label, lines: [[won ? '경기 승리' : '경기 패배', coins]], ups: ups };
  }
  function addLines(info, lines) { lines.forEach(function (l) { info.lines.push(l); info.coins += l[1]; }); }
  function playNext() {
    var s = state.season;
    if (s.phase === 'regular') {
      var r = currentRound(), g = myGameIn(r), label = r.round + '라운드';
      openMatch(g.home, g.away, label, function (res) {
        g.result = slim(res); addStats(g.home, g.away, res);
        var info = afterMyGame(g.home, g.away, res, label);
        r.games.forEach(function (x) { if (!x.result) { var rr = simGame(x.home, x.away); x.result = slim(rr); addStats(x.home, x.away, rr); } });
        // 개인 기록 랭커 보상 (라운드마다)
        var ll = leaderReward(); ll.forEach(function (l) { state.coins += l[1]; }); addLines(info, ll);
        s.round++;
        if (s.round >= s.rounds.length) addLines(info, startPlayoffs());
        save(); render(); showResult(info);
      });
    } else if (s.phase === 'playoff') {
      var sr = mySeries();
      if (!sr) { simOtherSeries(null); toastLines(checkStage()); save(); render(); return; }
      var po = s.playoff, ha = seriesHome(sr), lb = STAGE_NAME[po.stage] + ' ' + (sr.games.length + 1) + '차전';
      openMatch(ha[0], ha[1], lb, function (res) {
        applySeries(sr, ha[0], ha[1], res);
        var info = afterMyGame(ha[0], ha[1], res, lb);
        simOtherSeries(sr); addLines(info, checkStage());
        save(); render(); showResult(info);
      });
    }
  }

  function renderSchedule() {

  function pickForSlot(slot) {
    var list = myRoster().map(function (id) {
      var pen = S.fitPenalty(K.byId[id].pos, S.SLOT_POS[slot]), cur = state.starters.indexOf(id);

    }).sort(function (a, b) { return b.v - a.v; });

      state.starters[slot] = id;
      save(); render();

  /* ---------- 스카우트 ---------- */
  function doScout() {
    if (state.coins < SCOUT_COST) { toast('코인이 부족해요'); return; }
    state.coins -= SCOUT_COST;
    var mine = {}; myRoster().forEach(function (id) { mine[id] = 1; });
    var picked = [];
    var order = ['L', 'E', 'R', 'C'];
    for (var n = 0; n < 3; n++) {
      var r = Math.random(), acc = 0, rar = 'C';
      for (var i = 0; i < order.length; i++) { acc += RARITY[order[i]].rate; if (r < acc) { rar = order[i]; break; } }
      var pool = K.PLAYERS.filter(function (p) { return p.rarity === rar && !mine[p.id] && picked.indexOf(p.id) < 0; });
      if (!pool.length) pool = K.PLAYERS.filter(function (p) { return !mine[p.id] && picked.indexOf(p.id) < 0; });
      picked.push(pool[Math.floor(Math.random() * pool.length)].id);
    }
    state.scout = picked;
    ui.scoutPop = true;
    save(); render();
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), modal = el.closest('.modal');
    switch (act) {
      case 'pickTeam': ui.pickTeam = el.getAttribute('data-tid'); renderIntro(); break;
      case 'diff': ui.diff = el.getAttribute('data-v'); renderIntro(); break;
      case 'start': if (ui.pickTeam) { newGame(ui.pickTeam, ui.diff); save(); ui.tab = 'home'; render(); window.scrollTo(0, 0); toast(teamName(my()) + ' 감독으로 부임했어요'); } break;
      case 'tab': ui.tab = el.getAttribute('data-tab'); closeModal(); render(); window.scrollTo(0, 0); break;
      case 'ui': ui[el.getAttribute('data-k')] = el.getAttribute('data-v'); render(); break;
      case 'play': playNext(); break;
      case 'simPO': { var guard = 0, got = []; while (state.season.phase === 'playoff' && !mySeries() && guard++ < 40) { simOtherSeries(null); got = got.concat(checkStage()); } toastLines(got); save(); render(); break; }
      case 'newSeason': state.seasonNo++; newSeason(); save(); render(); toast(state.seasonNo + '시즌이 시작됐어요'); break;
      case 'reset':
        if (confirm('저장된 팀과 시즌 기록이 모두 지워져요. 처음부터 할까요?')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } state = null; resetGrowth(); ui.tab = 'home'; ui.pickTeam = null; render(); }
        break;
      case 'scout': doScout(); break;
      case 'scoutSkip': state.scout = null; state.coins += SCOUT_REFUND; save(); render(); break;
      case 'scoutPick': releasePicker(el.getAttribute('data-id'), 'scout'); break;
      case 'trade': releasePicker(el.getAttribute('data-id'), 'trade'); break;
      case 'release': {
        var pid = el.getAttribute('data-pid'), out = el.getAttribute('data-out'), mode = el.getAttribute('data-mode');
        var cost = mode === 'trade' ? tradeCost(pid, out) : 0;
        if (acquire(pid, out, cost)) {
          if (mode === 'scout') state.scout = null;
          save(); closeModal(); render();
          toast(K.byId[pid].name + ' 영입 · ' + K.byId[out].name + ' 방출');
        } else toast('영입할 수 없어요 (규정 또는 코인 확인)');
        break;
      }
      case 'player': showPlayer(el.getAttribute('data-id')); break;
      case 'setShooter': { var sid = el.getAttribute('data-id'); state.shooter = state.shooter === sid ? null : sid; save(); closeModal(); render(); break; }
      case 'shooterPick':
        pickSheet('주 슈터 지정 (슛을 더 많이 시도해요)', myRoster().map(function (id) { return { id: id, tag: '슈팅 ' + K.byId[id].a.sht }; }).sort(function (a, b) { return K.byId[b.id].a.sht - K.byId[a.id].a.sht; }), function (id) { state.shooter = id; save(); render(); });
        break;
      case 'tac': state.tac[el.getAttribute('data-k')] = el.getAttribute('data-v'); save(); render(); break;
      case 'close': closeModal(); render(); break;
      case 'slot': pickForSlot(+el.getAttribute('data-slot')); break;
      case 'pick': if (modal && modal._onPick) { var f = modal._onPick; closeModal(); f(el.getAttribute('data-id')); } break;
      case 'auto': autoLineup(); save(); render(); toast('가장 강한 라인업으로 편성했어요'); break;
    }
  });

  state = load();
  migrate();
  render();
  window.__KCL = { get state() { return state; }, sim: simGame, play: function () { playNext(); }, newGame: function (t) { newGame(t, ui.diff); } };
})();

</script>
</body>
</html>
